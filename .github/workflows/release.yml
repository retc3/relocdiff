name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: ".exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --package relocdiff --target ${{ matrix.target }}
      - name: Prepare release files
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/relocdiff${{ matrix.suffix }}" "dist/relocdiff-${{ matrix.target }}${{ matrix.suffix }}"
          sha256sum "dist/relocdiff-${{ matrix.target }}${{ matrix.suffix }}" > "dist/relocdiff-${{ matrix.target }}${{ matrix.suffix }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: relocdiff-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" dist/* --verify-tag --generate-notes

